name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: make build
      - run: make test
      - name: plugin metadata smoke test
        run: |
          ./bin/docker-sops docker-cli-plugin-metadata | grep -q '"Vendor": "mohsen0"'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built with the project's own Go toolchain, so the linter always
      # understands the targeted Go version and the v2 config format.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./cmd/docker-sops \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make install
      - run: docker sops version
      - run: make e2e
