name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: none

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # RELEASE_TOKEN is a fine-grained PAT (Contents: read/write) so the
          # formula commit below can pass the ruleset on main as an admin.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: generate THIRD_PARTY_LICENSES
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses report ./cmd/docker-sops --template scripts/licenses.tpl > THIRD_PARTY_LICENSES

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: update Homebrew formula
        run: |
          scripts/update-formula.sh "${GITHUB_REF_NAME#v}" dist/checksums.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/docker-sops.rb
          git commit -m "chore: update Homebrew formula to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
