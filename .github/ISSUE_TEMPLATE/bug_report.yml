name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `docker sops version` and `docker version --format '{{.Client.Version}}'`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact `docker sops ...` command. Add `--dry-run` output if relevant. Redact secrets.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Key backend
      options: [age, AWS KMS, GCP KMS, Azure Key Vault, Vault, PGP, other]
