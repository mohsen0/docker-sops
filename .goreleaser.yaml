version: 2

project_name: docker-sops

before:
  hooks:
    - go mod tidy

builds:
  - id: docker-sops
    main: ./cmd/docker-sops
    binary: docker-sops
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mohsen0/docker-sops/internal/version.Version={{.Version}}

# Plain binaries, no archives: each asset is directly executable.
archives:
  - id: docker-sops
    ids:
      - docker-sops
    formats: [binary]
    name_template: "docker-sops_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^docs\\("
      - "^chore\\("
      - "^test\\("
      - Merge pull request
      - Merge branch

release:
  prerelease: auto
  extra_files:
    - glob: THIRD_PARTY_LICENSES

snapshot:
  version_template: "{{ incpatch .Version }}-next"
