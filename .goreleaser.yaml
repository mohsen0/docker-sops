version: 2

project_name: docker-sops

before:
  hooks:
    - go mod tidy

builds:
  - id: docker-sops
    main: ./cmd/docker-sops
    binary: docker-sops
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mohsen0/docker-sops/internal/version.Version={{.Version}}

archives:
  - id: docker-sops
    ids:
      - docker-sops
    formats: [tar.gz]
    name_template: "docker-sops_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - THIRD_PARTY_LICENSES

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^docs\\("
      - "^chore\\("
      - "^test\\("
      - Merge pull request
      - Merge branch

release:
  prerelease: auto

# The Homebrew tap lives in this repository (Casks/), so users run
#   brew tap mohsen0/docker-sops https://github.com/mohsen0/docker-sops
#   brew install --cask docker-sops
# GoReleaser commits the generated cask to main with the workflow token.
homebrew_casks:
  - name: docker-sops
    skip_upload: auto   # pre-release tags (v1.0.0-rc1) do not update the cask
    repository:
      owner: mohsen0
      name: docker-sops
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/mohsen0/docker-sops"
    description: "Docker CLI plugin that lets docker commands consume sops-encrypted files without leaving plaintext behind"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: update Homebrew cask to {{ .Tag }}"
    binaries:
      - docker-sops
    hooks:
      post:
        install: |
          # Docker only discovers plugins in its cli-plugins directory.
          plugins = "#{Dir.home}/.docker/cli-plugins"
          system_command "/bin/mkdir", args: ["-p", plugins]
          system_command "/bin/ln", args: ["-sfn", "#{staged_path}/docker-sops", "#{plugins}/docker-sops"]
    caveats: |
      Installed as a Docker CLI plugin and linked into ~/.docker/cli-plugins.
      Run `docker sops --help` to get started.

snapshot:
  version_template: "{{ incpatch .Version }}-next"
